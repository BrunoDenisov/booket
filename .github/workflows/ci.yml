name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: |
          dotnet test tests/Booket.Domain.Tests --no-build --configuration Release
          dotnet test tests/Booket.Application.Tests --no-build --configuration Release

      # Testcontainers uses the Docker daemon available on GitHub-hosted Ubuntu runners.
      - name: Integration tests
        run: dotnet test tests/Booket.Api.IntegrationTests --no-build --configuration Release

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --file src/Booket.Api/Dockerfile --tag booket-api:ci .
